<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Lab Komputer</title>
  <link rel="stylesheet" href="./src/output.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-amber-950 min-h-screen text-slate-100 py-12 px-4 sm:px-6 relative">

  <!-- Efek Cahaya Background Dekoratif -->
  <div class="fixed w-[500px] h-[500px] bg-amber-500/5 rounded-full blur-3xl -top-32 -left-32 pointer-events-none"></div>
  <div class="fixed w-[500px] h-[500px] bg-blue-500/5 rounded-full blur-3xl -bottom-32 -right-32 pointer-events-none"></div>

  <main class="w-full max-w-xl mx-auto bg-slate-900/80 backdrop-blur-xl border border-slate-700/60 rounded-[28px] p-8 sm:p-10 shadow-2xl animate-fade-in relative z-10">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-400 shadow-inner">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Buat Akun Baru</h1>
      <p class="text-xs text-slate-400 mt-1">Lengkapi data diri Anda untuk akses laboratorium komputer</p>
    </div>
    
    <form action="index.html" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Nama Lengkap -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Nama</label>
          <input type="text" placeholder="Asga" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white placeholder-slate-500 transition">
        </div>
        <!-- Email -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Email</label>
          <input type="email" placeholder="nama@sekolah.sch.id" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white placeholder-slate-500 transition">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Tanggal Lahir -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Tanggal Lahir</label>
          <input type="date" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white transition">
        </div>
        <!-- No HP -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Nomor HP / WhatsApp</label>
          <input type="tel" placeholder="081234567890" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white placeholder-slate-500 transition">
        </div>
      </div>

      <!-- Gender (Opsi Pilih) -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Jenis Kelamin</label>
        <select class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white transition">
          <option value="" disabled selected class="bg-slate-900">Pilih jenis kelamin</option>
          <option value="Laki-laki" class="bg-slate-900">Laki-laki</option>
          <option value="Perempuan" class="bg-slate-900">Perempuan</option>
        </select>
      </div>

      <!-- Alamat -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Alamat Lengkap</label>
        <textarea rows="2" placeholder="Jl. Contoh No. 123, Bandung" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white placeholder-slate-500 transition resize-none"></textarea>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Kata Sandi</label>
        <input type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white placeholder-slate-500 transition">
      </div>

      <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl transition-all duration-200 text-sm shadow-lg shadow-amber-500/20 active:scale-[0.98] mt-2">
        Daftar Sekarang
      </button>
    </form>
    
    <p class="text-xs text-center text-slate-400 mt-6">
      Sudah punya akun? <a href="index.html" class="text-amber-400 font-bold hover:underline">Masuk di sini</a>
    </p>
  </main>
</body>
</html>
