<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asga Nathaniel</title>
  <link rel="stylesheet" href="./src/output.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-amber-950 min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-100 relative overflow-hidden">

  <!-- Efek Cahaya Background Dekoratif -->
  <div class="absolute w-96 h-96 bg-amber-500/10 rounded-full blur-3xl -top-20 -left-20 pointer-events-none"></div>
  <div class="absolute w-96 h-96 bg-blue-500/10 rounded-full blur-3xl -bottom-20 -right-20 pointer-events-none"></div>

  <main class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-700/60 rounded-[28px] p-8 shadow-2xl animate-fade-in relative z-10">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-400 shadow-inner">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Selamat Datang</h1>
      <p class="text-xs text-slate-400 mt-1">Masuk untuk mengakses sistem Lab Komputer</p>
    </div>
    
    <form action="siswa.html" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Email</label>
        <input type="email" placeholder="nama@sekolah.sch.id" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white placeholder-slate-500 transition">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-white placeholder-slate-500 transition">
      </div>
      <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl transition-all duration-200 text-sm shadow-lg shadow-amber-500/20 active:scale-[0.98]">
        Login
      </button>
    </form>
    
    <p class="text-xs text-center text-slate-400 mt-6">
      Belum punya akun? <a href="register.html" class="text-amber-400 font-bold hover:underline">Daftar sekarang</a>
    </p>
  </main>
</body>
</html>
